# TrendCipher web — nginx config for the Vite SPA + same-origin API proxy.
# Backend is reachable at http://backend:8000 inside the compose network.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: all non-file routes return index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy → backend service (compose network)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Also proxy the raw health endpoint used by container healthchecks
    location = /healthz {
        proxy_pass http://backend:8000/healthz;
        proxy_set_header Host $host;
    }

    location = /docs {
        return 302 /api/v1/docs;
    }

    # Static asset caching
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
}